[project]
name = "lindrop"
version = "0.6.0"
description = "A compact private LAN desktop toolbox"
requires-python = ">=3.12,<3.13"
dependencies = ["tkinterdnd2==0.6.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
