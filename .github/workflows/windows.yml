name: Windows verification and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Restore locked dependencies
        run: uv sync --locked --python 3.12.15
      - name: Lint and test
        run: |
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force outputs | Out-Null
          uv run --locked pytest -q --basetemp=outputs/test-temp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable EXE
        run: ./scripts/Build-LanDrop.ps1
      - name: Verify bundled runtime on loopback
        run: |
          $taskExe = Join-Path (Get-Location) 'outputs/邻传/邻传.exe'
          $taskProcess = Start-Process -FilePath $taskExe -ArgumentList '--self-test','--host','127.0.0.1','--data-dir','outputs/packaged-test' -PassThru -WindowStyle Hidden
          if (-not $taskProcess.WaitForExit(90000)) { $taskProcess.Kill(); throw 'Packaged self-test timed out' }
          $taskReport = Get-Content outputs/packaged-test/self-test.json -Raw | ConvertFrom-Json
          if (-not $taskReport.ok) { throw ($taskReport | ConvertTo-Json -Depth 5) }
      - name: Package and checksum
        run: ./scripts/New-ReleasePackage.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            outputs/release/lindrop-windows-x64.zip
            outputs/release/SHA256SUMS.txt
            outputs/release/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: outputs/release
      - name: Publish verified tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $taskZip = Get-Item outputs/release/lindrop-windows-x64.zip | Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG $taskZip outputs/release/SHA256SUMS.txt --verify-tag --title "邻传 $env:RELEASE_TAG" --notes-file outputs/release/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
